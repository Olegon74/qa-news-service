services:
  postgres:
    image: postgres:16
    container_name: qa-news-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qa_news_db
      POSTGRES_USER: qa_news_user
      POSTGRES_PASSWORD: qa_news_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_news_user -d qa_news_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: qa-news-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qa_news_db
      SPRING_DATASOURCE_USERNAME: qa_news_user
      SPRING_DATASOURCE_PASSWORD: qa_news_password
      APP_SECURITY_JWT_SECRET: change-me-to-a-long-secret-key-for-local-development-only-change-me-please
      APP_SECURITY_JWT_EXPIRATION_MS: 3600000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: qa-news-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
