name: Manual API and UI tests

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test scope
        required: true
        type: choice
        default: ui
        options:
          - api
          - ui
          - all
      test_class:
        description: Test class (all means every class in scope)
        required: true
        type: choice
        default: all
        options:
          - all
          - ArchivingNewsTests
          - AuthApiTests
          - CreatingNewsTests
          - DeletingNewsTests
          - GettingNewsTests
          - PublishingNewsTests
          - UpdatingNewsTests
          - ArchivingNewsUiTests
          - AuthorizationUiTests
          - CreatingNewsUiTests
          - DeletingNewsUiTests
          - LogoutUiTests
          - PublishingNewsUiTests
          - UpdatingNewsUiTests
          - ViewingNewsUiTests
      browser:
        description: Browser
        required: true
        type: choice
        default: chrome
        options:
          - chrome
          - firefox
          - opera
          - edge
      browser_version:
        description: Older browser version (two available image releases)
        required: true
        type: choice
        default: previous
        options:
          - previous
          - before_previous
      browser_size:
        description: Browser resolution
        required: true
        type: choice
        default: 1920x1080
        options:
          - 1920x1080
          - 1366x768
          - 1280x720
      test_tag:
        description: Run all tests or only SMOKE tests in scope
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - SMOKE
      selenoid_limit:
        description: Parallel Selenoid sessions limit
        required: true
        type: choice
        default: "6"
        options:
          - "3"
          - "6"
          - "9"

jobs:
  tests:
    name: ${{ inputs.test_scope }} / ${{ inputs.test_class }} / ${{ inputs.test_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TEST_SCOPE: ${{ inputs.test_scope }}
      TEST_CLASS: ${{ inputs.test_class }}
      BROWSER: ${{ inputs.browser }}
      BROWSER_VERSION: ${{ inputs.browser_version }}
      BROWSER_SIZE: ${{ inputs.browser_size }}
      TEST_TAG: ${{ inputs.test_tag }}
      SELENOID_LIMIT: ${{ inputs.selenoid_limit }}
      VITE_API_BASE_URL: /
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate test selection
        shell: bash
        run: |
          set -euo pipefail
          case "${TEST_SCOPE}" in
            all)
              if [[ "${TEST_CLASS}" != all ]]; then
                echo "Choose test_class=all when test_scope=all" >&2
                exit 1
              fi
              ;;
            api)
              if [[ "${TEST_CLASS}" == *UiTests ]]; then
                echo "Choose an API test class or all for test_scope=api" >&2
                exit 1
              fi
              ;;
            ui)
              if [[ "${TEST_CLASS}" != all && "${TEST_CLASS}" != *UiTests ]]; then
                echo "Choose a UI test class or all for test_scope=ui" >&2
                exit 1
              fi
              ;;
            *) echo "Unsupported test_scope: ${TEST_SCOPE}" >&2; exit 1 ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve selected browser image
        if: ${{ inputs.test_scope != 'api' }}
        id: browser-image
        shell: bash
        run: |
          set -euo pipefail

          browser_key="${BROWSER}"
          if [[ "${BROWSER}" == "edge" ]]; then browser_key="MicrosoftEdge"; fi

          version=$(jq -er --arg browser "${browser_key}" --arg slot "${BROWSER_VERSION}" '
            .[$browser] as $config |
            if $slot == "previous" then $config.default
            elif $slot == "before_previous" then
              ($config.versions | keys | map(select(. != $config.default)) | .[0])
            else error("Unsupported version slot") end
          ' selenoid/browsers.json)
          image=$(jq -er --arg browser "${browser_key}" --arg version "${version}" \
            '.[$browser].versions[$version].image' selenoid/browsers.json)

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Selected browser image: ${image} (${version})"

      - name: Pull Selenoid browser image
        if: ${{ inputs.test_scope != 'api' }}
        run: docker pull "${{ steps.browser-image.outputs.image }}"

      - name: Start application and test services
        shell: bash
        run: |
          set -euo pipefail
          services=(postgres backend)
          if [[ "${TEST_SCOPE}" != api ]]; then
            services+=(frontend selenoid selenoid-ui)
          fi
          docker compose --profile ui-tests up -d --build "${services[@]}"

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail

          wait_url() {
            local name="$1"
            local url="$2"

            for attempt in {1..60}; do
              if curl -fsS "${url}" >/dev/null; then
                echo "${name} is ready"
                return 0
              fi
              echo "Waiting for ${name} (${attempt}/60)"
              sleep 2
            done

            echo "${name} is not ready: ${url}" >&2
            docker compose ps
            docker compose logs --no-color backend frontend selenoid
            return 1
          }

          wait_url "Backend" "http://localhost:8080/v3/api-docs"
          if [[ "${TEST_SCOPE}" != api ]]; then
            wait_url "Frontend" "http://localhost:3000"
            wait_url "Selenoid" "http://localhost:4444/status"
          fi

      - name: Run selected tests
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          run_profile() {
            local scope="$1"
            local profile tag
            if [[ "${scope}" == api ]]; then
              profile=parallel-api
              tag=API
              if [[ "${TEST_TAG}" == SMOKE ]]; then tag='API & SMOKE'; fi
            else
              profile=parallel-ui
              tag=UI
              if [[ "${TEST_TAG}" == SMOKE ]]; then tag=SMOKE; fi
            fi

            local -a args=(
              mvn -B test "-P${profile}" "-Dtag=${tag}" -Denv=dev
              -Dapi.base_url=http://localhost:8080
              -Ddb.jdbc_url=jdbc:postgresql://localhost:5432/qa_news_db
              -Ddb.username=qa_news_user -Ddb.password=qa_news_password
            )
            if [[ "${TEST_CLASS}" != all ]]; then
              args+=("-Dtest=${TEST_CLASS}")
            fi
            if [[ "${scope}" == ui ]]; then
              args+=(
                -Dui.base_url=http://frontend
                -Dremote_url=http://localhost:4444/wd/hub
                "-Dbrowser=${BROWSER}"
                "-Dbrowser_version=${{ steps.browser-image.outputs.version }}"
                "-Dbrowser_size=${BROWSER_SIZE}"
                -Dheadless=false
                "-Dselenoid.session_name=qa-news ${BROWSER} ${{ steps.browser-image.outputs.version }} ${BROWSER_SIZE}"
              )
            fi
            "${args[@]}"
          }

          result=0
          if [[ "${TEST_SCOPE}" == api || "${TEST_SCOPE}" == all ]]; then
            run_profile api || result=1
          fi
          if [[ "${TEST_SCOPE}" == ui || "${TEST_SCOPE}" == all ]]; then
            run_profile ui || result=1
          fi
          exit "${result}"

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p backend/target/docker-logs
          docker compose ps > backend/target/docker-logs/compose-ps.txt || true
          docker compose logs --no-color backend > backend/target/docker-logs/backend.log || true
          docker compose logs --no-color frontend > backend/target/docker-logs/frontend.log || true
          docker compose logs --no-color selenoid > backend/target/docker-logs/selenoid.log || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ inputs.test_scope }}-${{ inputs.test_class }}-${{ inputs.test_tag }}-${{ github.run_id }}
          path: |
            backend/target/surefire-reports
            backend/target/allure-results
            backend/target/docker-logs
            selenoid/logs
          if-no-files-found: ignore

      - name: Stop containers
        if: always()
        run: docker compose down -v
