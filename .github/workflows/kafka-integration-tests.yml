name: Kafka integration tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/kafka-integration-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/kafka-integration-tests.yml'
  workflow_dispatch:

jobs:
  kafka-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Kafka and PostgreSQL integration tests
        run: mvn -B -f backend/pom.xml -Pkafka-it verify
      - name: Upload test reports and Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-integration-test-results
          path: |
            backend/target/failsafe-reports/
            backend/target/allure-results/
          if-no-files-found: ignore
